<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>card</title>
<!--
  본문 카드 틀 (폭 1080, 높이는 내용에 맞춤). 이 파일을 복사해 쓴다.
  아래 다섯 블록(계산 · 막대 비교 · 순서 · 표 · 선 그래프) 가운데 이 이미지에 필요한 것 하나만 남기고 나머지는 지운다.
  한 장에 한 가지만 보여 준다. 숫자는 숫자 장부에서 복사한다.
  들어 있는 문구와 숫자는 자리만 잡아 둔 것이다. 전부 바꾼다.
-->
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #171717;
    --sub: #525252;
    --dim: #8a8f98;
    --line: rgba(23, 23, 23, 0.09);
    --accent: #14171f;      /* 강조 면 */
    --mark: #ffd43b;        /* 썸네일과 같은 노랑. 한 장에 한두 곳만 */
    --up: #d62f2f;          /* 오름 */
    --down: #2563d9;        /* 내림 */
    --font: 'Pretendard', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 1080px; background: var(--bg); }
  body { width: 1080px; padding: 56px; font-family: var(--font); color: var(--ink); word-break: keep-all; }
  .card { background: var(--card); border-radius: 28px; padding: 64px 64px 48px; }
  .title { font-size: 46px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; }
  .desc { margin-top: 14px; font-size: 30px; color: var(--sub); line-height: 1.5; }
  .block { margin-top: 48px; }
  .foot {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 24px;
    font-size: 24px; color: var(--dim); line-height: 1.4;
  }
  .foot span:last-child { white-space: nowrap; flex-shrink: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* 계산 */
  .calc .cond { display: flex; flex-wrap: wrap; gap: 12px; }
  .calc .cond span { font-size: 28px; color: var(--sub); background: var(--bg); padding: 10px 20px; border-radius: 999px; }
  .calc .expr { margin-top: 32px; font-size: 40px; font-weight: 500; color: var(--sub); }
  .calc .result { margin-top: 20px; display: flex; align-items: baseline; gap: 14px; }
  .calc .result b { font-size: 120px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .calc .result span { font-size: 44px; font-weight: 600; }
  .calc .note { margin-top: 18px; font-size: 28px; color: var(--sub); }

  /* 막대 비교 */
  .bars .row { display: grid; grid-template-columns: 220px 1fr 190px; align-items: center; gap: 24px; margin-top: 26px; }
  .bars .row:first-child { margin-top: 0; }
  .bars .name { font-size: 32px; font-weight: 500; }
  .bars .track { height: 52px; background: var(--bg); border-radius: 10px; overflow: hidden; }
  .bars .fill { height: 100%; background: #c9ced6; border-radius: 10px; }
  .bars .row.hero .fill { background: var(--accent); }
  .bars .val { font-size: 36px; font-weight: 700; text-align: right; }

  /* 순서 */
  .steps .step { display: grid; grid-template-columns: 210px 1fr; gap: 28px; padding: 26px 0; border-top: 1px solid var(--line); }
  .steps .step:first-child { border-top: 0; padding-top: 0; }
  .steps .when { font-size: 32px; font-weight: 700; }
  .steps .what { font-size: 32px; line-height: 1.45; }
  .steps .what small { display: block; margin-top: 6px; font-size: 26px; color: var(--sub); }
  .steps .step.hero .when { background: var(--mark); padding: 2px 12px; border-radius: 8px; justify-self: start; align-self: start; }

  /* 표 */
  table { width: 100%; border-collapse: collapse; font-size: 32px; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 26px; padding: 0 0 16px; }
  td { padding: 22px 0; border-top: 1px solid var(--line); }
  th:not(:first-child), td:not(:first-child) { text-align: right; }
  tr.hero td { font-weight: 700; }

  /* 선 그래프 */
  .chart svg { width: 100%; height: auto; }
  .chart .unit { text-align: right; font-size: 24px; color: var(--dim); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">이 카드가 보여 주는 것 한 줄</div>
  <div class="desc">어떤 조건으로 본 값인지 한 문장.</div>

  <!-- 1) 계산: 조건 → 식 → 결과. 오른 값이면 결과에 class="num up", 내린 값이면 "num down" -->
  <div class="block calc">
    <div class="cond"><span>조건 하나</span><span>조건 둘</span><span>조건 셋</span></div>
    <div class="expr num">가 × 나 ÷ 다</div>
    <div class="result"><b class="num">00,000</b><span>원 / 월</span></div>
    <div class="note">이 값에 들어가지 않은 것을 한 줄로.</div>
  </div>

  <!-- 2) 막대 비교: 주인공 한 줄에만 hero. width 는 실제 값의 비율로 계산해 넣는다 -->
  <div class="block bars">
    <div class="row hero"><div class="name">가</div><div class="track"><div class="fill" style="width: 88%"></div></div><div class="val num">0.00%</div></div>
    <div class="row"><div class="name">나</div><div class="track"><div class="fill" style="width: 70%"></div></div><div class="val num">0.00%</div></div>
    <div class="row"><div class="name">다</div><div class="track"><div class="fill" style="width: 52%"></div></div><div class="val num">0.00%</div></div>
  </div>

  <!-- 3) 순서: 강조할 단계 하나에만 hero -->
  <div class="block steps">
    <div class="step"><div class="when">0월 0일</div><div class="what">무슨 일이 있는 날인지<small>독자에게 어떤 뜻인지 한 줄</small></div></div>
    <div class="step hero"><div class="when">0월 0일</div><div class="what">가장 중요한 날<small>왜 이날이 중요한지 한 줄</small></div></div>
    <div class="step"><div class="when">0월 0일</div><div class="what">그다음 일<small>한 줄</small></div></div>
  </div>

  <!-- 4) 표: 3~4줄까지. 주인공 줄에 class="hero" -->
  <div class="block">
    <table>
      <tr><th>구분</th><th>값</th><th>변화</th></tr>
      <tr><td>가</td><td class="num">0,000원</td><td class="num up">+0.00%p</td></tr>
      <tr class="hero"><td>나</td><td class="num">0,000원</td><td class="num up">+0.00%p</td></tr>
      <tr><td>다</td><td class="num">0,000원</td><td class="num down">−0.00%p</td></tr>
    </table>
  </div>

  <!-- 5) 선 그래프: scripts/linechart.py 가 만든 <svg>…</svg> 를 아래 주석 자리에 붙인다 -->
  <div class="block chart">
    <div class="unit">단위: 연 %</div>
    <!-- 여기에 linechart.py 출력 -->
  </div>

  <div class="foot"><span>자료: 기관 · 자료 이름 (기준일)</span><span>기사 다음 장</span></div>
</div>
</body>
</html>
